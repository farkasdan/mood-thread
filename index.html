<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mood Thread</title>
<meta name="description" content="Swipe to how you feel, let go, and watch your day's mood curve grow.">
<meta name="theme-color" content="#507A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mood Thread">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one phone-width screen that never scrolls. The mood swipe IS the app: curve in thin white lines on top,
   the blob in the middle, and the actions rising from the bottom once a mood is chosen. The whole screen takes the mood's colour. */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --ink:#151924; --muted:#697085; --line:#E4E7ED; --track:#ECEEF3; --hatch:#C6CBD6; --stage:#0B0C10;
  --shadow:0 1px 2px rgba(21,25,36,.05),0 8px 24px rgba(21,25,36,.07);
  --font-display:"Outfit", ui-sans-serif, system-ui, sans-serif;
  --font-mood:"Fraunces", "Canela", Georgia, serif;
  --fg:255,255,255; --inv:21,25,36;
  --font-body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1117; --surface:#181B24; --ink:#ECEEF4; --muted:#9198AA; --line:#272B37; --track:#222632; --hatch:#3E4352; --stage:#07080C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1117; --surface:#181B24; --ink:#ECEEF4; --muted:#9198AA; --line:#272B37; --track:#222632; --hatch:#3E4352; --stage:#07080C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--stage);color:rgb(var(--fg));font-family:var(--font-display);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid rgb(var(--fg));outline-offset:2px}

.app{--g1:#7A5E06;--g2:#C29A1E;position:relative;width:min(430px,100%);height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;color:rgb(var(--fg));
  background:radial-gradient(120% 56% at 50% 46%,rgba(255,255,255,.2),transparent 64%),linear-gradient(172deg,var(--g1),var(--g2));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 14px}

/* top: the curve, in thin white lines */
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;height:34px}
.daynav{display:flex;align-items:center}
.daynav button{background:none;border:0;color:rgb(var(--fg));cursor:pointer}
.chev{width:22px;height:30px;display:grid;place-items:center;opacity:.55}
.chev:disabled{opacity:.16;cursor:default}
.daylabel{font-weight:300;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.9;padding:6px 4px;white-space:nowrap}
.tools{display:flex;align-items:center;gap:6px}
.tg{display:flex}
.tg button{font-weight:300;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;background:none;border:0;border-bottom:1px solid transparent;padding:6px 6px 4px;margin:0 2px;opacity:.5;cursor:pointer}
.tg button[aria-pressed="true"]{opacity:1;border-bottom-color:rgba(var(--fg),.8)}
.pinbtn{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid rgba(var(--fg),.4);background:none;color:inherit;display:grid;place-items:center;cursor:pointer;padding:0}
.pinbtn svg{width:14px;height:14px}
.chart{min-height:118px}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart .mid{stroke:rgb(var(--fg));stroke-opacity:.28;stroke-width:1;stroke-dasharray:1.5 5}
.chart .sep{stroke:rgb(var(--fg));stroke-opacity:.16;stroke-width:1}
.chart .lbl{font-family:var(--font-display);font-size:9px;font-weight:300;letter-spacing:.1em;fill:rgb(var(--fg));fill-opacity:.55;text-transform:uppercase}
.chart .lbl.on{fill-opacity:1;font-weight:500}
/* the curve itself is heat-mapped: red at the bottom, green at the top. A thin white edge keeps it readable on any mood colour. */
.chart .line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart .lineb{fill:none;stroke:rgb(var(--fg));stroke-opacity:.9;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.chart .nowl{stroke:rgb(var(--fg));stroke-opacity:.3;stroke-width:1}
.chart .none{font-family:var(--font-display);font-size:12px;font-weight:300;letter-spacing:.08em;fill:rgb(var(--fg));fill-opacity:.6}
.pt{cursor:pointer;outline:none}
/* crown = the day's highlight, skull = its low point: on the feedback screen's corners, on both curves, in the places view and in the wrap-up */
.mk{cursor:pointer;fill:rgb(var(--fg));outline:none}
.mk:focus-visible path,.mk:hover path{filter:drop-shadow(0 0 3px rgb(var(--fg)))}
.mkb{position:absolute;left:0;top:4px;z-index:3;display:grid;justify-items:center;gap:4px;width:60px;padding:0;border:0;background:none;color:rgb(var(--fg));cursor:pointer;opacity:0;pointer-events:none;transform:scale(.6);transition:opacity .2s,transform .2s}
.mkb.r{left:auto;right:0}
.mkb svg{box-sizing:border-box;width:44px;height:44px;padding:10px;border-radius:50%;border:1px solid rgba(var(--fg),.5);background:rgba(var(--fg),.12);fill:currentColor;transition:background .2s,color .2s,box-shadow .2s}
.mkb span{font-weight:300;font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.mkb[aria-pressed="true"] svg{background:rgb(var(--fg));color:var(--g1);border-color:transparent;box-shadow:0 0 14px rgba(255,255,255,.55)}
.mkb[aria-pressed="true"] span{opacity:1;font-weight:500}
.app.noticed .mkb{opacity:1;pointer-events:auto;transform:none;transition:opacity .4s ease 2s,transform .5s cubic-bezier(.3,1.6,.5,1) 2s}
.mkb.pop svg{animation:fpop .5s cubic-bezier(.3,1.6,.5,1)}
.ib svg.mki{fill:currentColor;stroke:none;width:23px;height:23px}
.wr-mkbig svg{display:block;width:62px;height:62px;fill:rgb(var(--fg))}
.wr-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 2px;width:100%;max-width:350px}
.wr-pick button{border:0;background:none;color:#fff;display:grid;justify-items:center;gap:0;font-weight:300;font-size:11.5px;cursor:pointer;padding:2px 0 4px;min-width:0}
.wr-pick button:disabled{opacity:.35;cursor:default}
.wr-pick svg{width:min(66px,18vw);height:min(66px,18vw);overflow:visible}
.wr-pick b{font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.wr-pick span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr-mk{fill:rgb(var(--fg));animation:wrPt .5s ease 2s backwards}
.map .mki{fill:#fff;pointer-events:none}
.pt .d{fill:rgb(var(--fg));transition:r .15s}
.pt .d.bare{fill:rgba(0,0,0,.28);stroke:rgb(var(--fg));stroke-width:1.4}
.pt:hover .d,.pt:focus-visible .d{r:5.5}
.pt.land .d{animation:land .7s ease-out}
@keyframes land{0%{r:1}45%{r:9}100%{r:3.4}}
.wkd{fill:transparent;cursor:pointer}
.wkd:hover{fill:rgb(var(--fg));fill-opacity:.07}
#ghost{fill:none;stroke:rgb(var(--fg));stroke-width:1.6;animation:gh 1.4s ease-in-out infinite alternate}
@keyframes gh{from{stroke-opacity:.35}to{stroke-opacity:1}}
#ghostL{stroke:rgb(var(--fg));stroke-opacity:.5;stroke-width:1.2;stroke-dasharray:2 4}
/* the dashboard (date, day/week, places, curve) hides behind a tab that hangs from the top: pull it down or tap it */
.dash{height:0;overflow:hidden;transition:height .4s cubic-bezier(.3,.7,.2,1)}
.dash.drag{transition:none}
.dash-in{padding-top:8px;padding-bottom:4px}
.pull{position:relative;min-height:30px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.under{display:grid;justify-items:center;margin-top:16px;padding-bottom:6px}
.tab{position:absolute;left:50%;top:0;margin-left:-46px;width:92px;height:30px;padding:0;border:0;background:none;color:rgb(var(--fg));display:grid;place-items:center;cursor:grab;touch-action:none}
.tab svg{width:54px;height:16px;transition:transform .35s;animation:tabHint 2.6s ease-in-out infinite}
@keyframes tabHint{0%,70%,100%{translate:0 0}85%{translate:0 3px}}
.app.dashOpen .tab svg{transform:rotate(180deg);animation:none}
.tab.bump svg{animation:tabBump .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabBump{0%{scale:1}40%{scale:1.35 1.7}100%{scale:1}}
/* four check-ins a day: four little blobs that wake up one by one */
.checks{display:grid;justify-items:center;gap:7px;font-weight:300;font-size:11px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.ckrow{display:flex;gap:9px}
.checks .ck{width:29px;height:29px}
.checks em,.ndchecks em{font-style:normal;opacity:.85}
.ck{position:relative;flex:none;width:22px;height:22px;display:grid;place-items:center}
.ck svg{display:block;width:100%;height:100%;overflow:visible}
.ck.zz{opacity:.62}
.ck.next svg{animation:ckWait 1.9s ease-in-out infinite}
.ck.prog svg{animation:ckWait .9s ease-in-out infinite}
@keyframes ckWait{0%,100%{transform:scale(.9)}50%{transform:scale(1.12)}}
.ck.pop svg{animation:ckPop .8s cubic-bezier(.3,1.7,.5,1) backwards}
@keyframes ckPop{0%{transform:scale(.2) rotate(-30deg)}60%{transform:scale(1.4) rotate(8deg)}100%{transform:none}}
.ck.pop::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid rgb(var(--fg));opacity:0;pointer-events:none;animation:ckRing .8s ease-out}
@keyframes ckRing{from{opacity:.9;transform:scale(.5)}to{opacity:0;transform:scale(2.4)}}
.exnote{display:block;margin:0 auto;white-space:nowrap;background:none;border:0;font-weight:300;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;cursor:pointer;padding:4px 8px}

/* middle: swipe the mood */
.temp{position:relative;flex:1;min-height:0;touch-action:none;cursor:ns-resize;user-select:none;-webkit-user-select:none;outline:none}
.temp:focus-visible{box-shadow:inset 0 0 0 1.5px rgba(var(--fg),.5);border-radius:24px;outline:none}
.facewrap{position:absolute;left:0;right:30px;top:50%;transform:translateY(-50%);display:grid;justify-items:center;gap:2px;pointer-events:none}
#face{width:min(220px,54vw,29vh);height:min(220px,54vw,29vh);overflow:visible}
.word{margin:4px 0 0;font-family:var(--font-mood);font-weight:800;font-variation-settings:"SOFT" 100,"WONK" 0;font-size:40px;letter-spacing:.015em;text-transform:uppercase;line-height:1.1;min-height:1.1em}
.detail{margin:0;font-weight:300;font-size:13px;letter-spacing:.03em;opacity:.88;min-height:1.4em;max-width:100%;padding:0 10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vscale{transition:opacity .3s;position:absolute;right:0;top:12%;bottom:12%;width:24px;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.55;pointer-events:none}
.vscale span{font-weight:300;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;writing-mode:vertical-rl;white-space:nowrap}
.vs-line{position:relative;flex:1;width:1px;background:rgba(var(--fg),.7);display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.vs-line i{display:block;width:7px;height:1px;background:rgb(var(--fg))}
.vs-line b{position:absolute;left:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:rgb(var(--fg));box-shadow:0 0 0 3px rgba(var(--fg),.25)}
/* the sideways scale: fine-tuning within the mood */
.hscale{position:absolute;left:0;right:30px;bottom:34px;display:flex;align-items:center;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .3s}
.app.fine .hscale{opacity:.7}
.app.fine .vscale{opacity:0}
.wscale{position:absolute;right:0;top:11%;bottom:17%;width:24px;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;transition:opacity .3s}
.wscale .vs-line i.mid{width:13px}
.wlab{position:absolute;right:28px;font-weight:300;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s}
#wU{top:calc(11% - 6px)}
#wD{bottom:calc(17% - 6px)}
.app.fine.cored .wscale,.app.fine.cored .wlab{opacity:.7}
.backb{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;border:1px solid rgba(var(--fg),.45);background:rgba(var(--fg),.12);color:rgb(var(--fg));font:inherit;font-weight:400;font-size:11.5px;letter-spacing:.08em;padding:7px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;z-index:2}
.app.fine .backb{display:block}
.app.dashOpen .backb,.app.dashOpen .wscale,.app.dashOpen .wlab{display:none}
.hscale span{flex:1;min-width:0;font-weight:300;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hscale span:first-child{text-align:right}
.hs-line{position:relative;flex:none;width:calc(var(--n, 3) * 24px);height:1px;background:rgba(var(--fg),.7);display:flex;justify-content:space-between;align-items:center}
.hs-line i{display:block;width:1px;height:7px;background:rgb(var(--fg))}
.hs-line i.mid{height:13px}
.hs-line b{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:rgb(var(--fg));box-shadow:0 0 0 3px rgba(var(--fg),.25)}
.app.noticed .hscale{opacity:0}
.hint{position:absolute;left:0;right:30px;bottom:6px;margin:0;text-align:center;font-weight:300;font-size:11px;letter-spacing:.16em;text-transform:uppercase;transition:opacity .3s;pointer-events:none}

/* bottom: appears once the swipe stops */
.actions{display:grid;justify-items:center;gap:10px;transition:opacity .32s ease,transform .32s cubic-bezier(.3,.7,.2,1)}
.actions:not(.show){opacity:0;transform:translateY(18px);pointer-events:none}
.meta{display:inline-flex;align-items:center;gap:6px;background:none;border:0;font-weight:300;font-size:12.5px;letter-spacing:.08em;opacity:.9;cursor:pointer;padding:4px 10px}
.meta svg{width:12px;height:12px}
.icons{display:flex;gap:22px}
.icons.static{gap:12px}
.ib{position:relative;width:56px;height:56px;border-radius:50%;border:1px solid rgba(var(--fg),.5);background:rgba(var(--fg),.14);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .12s,background .2s,color .2s}
.ib:active{transform:scale(.94)}
.ib svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib svg .f{fill:currentColor;stroke:none}
.ib.set{background:rgb(var(--fg));color:rgb(var(--inv));border-color:rgb(var(--fg))}
/* the one action: a narrower glowing pill. The two extras pop out of it once the feeling is noticed. */
.slot{display:grid;place-items:center;width:100%}
.slot > *{grid-area:1/1}
.slot{min-height:112px;padding-top:6px}
.ib{transition:transform .2s,background .2s,color .2s}
/* the two fine-tuning buttons that follow the affirmation */
.tune{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;width:100%;align-items:center}
.okb{grid-column:2;grid-row:1/3;width:58px;height:58px;border-radius:50%;border:0;background:rgb(var(--fg));color:var(--g1);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28),0 10px 18px rgba(0,0,0,.22);opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .2s,transform .2s}
.okb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.actions.noticed .okb{opacity:1;transform:none;pointer-events:auto;transition:opacity .4s ease 2.75s,transform .6s cubic-bezier(.3,1.7,.5,1) 2.75s}
.actions.noticed .okb:active{transform:scale(.92);transition:transform .1s}
.tb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid rgba(var(--fg),.5);border-radius:999px;padding:11px 18px 11px 14px;color:rgb(var(--fg));cursor:pointer;
  background:rgba(var(--fg),.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-weight:300;font-size:15.5px;letter-spacing:.02em;
  opacity:0;transform:translateY(18px);pointer-events:none;transition:opacity .2s,transform .2s,background .2s}
.tb svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tb svg .f{fill:currentColor;stroke:none}
.tb span{flex:1;min-width:0}
.tb{grid-column:1}
.helpt{grid-column:1/-1;background:rgba(var(--fg),.28);font-weight:400}
.helpt svg{width:19px;height:19px;margin:0 3px 0 2px}
.tune.hashelp .okb{grid-row:2/4}
.tb.set{background:rgba(var(--fg),.3)}
.tb.set::after{content:"✓";font-weight:400}
.tb:active{background:rgba(var(--fg),.3)}
.actions.noticed .tb{opacity:1;transform:none;pointer-events:auto;transition:opacity .5s ease 2.4s,transform .6s cubic-bezier(.3,1.5,.5,1) 2.4s,background .2s}
.actions.noticed .tb + .tb{transition-delay:2.56s,2.56s,0s}

/* after "Feeling noticed": the blob steps back and the affirmation takes the stage */
#face{transition:width .5s cubic-bezier(.3,.7,.2,1),height .5s cubic-bezier(.3,.7,.2,1)}
.word{transition:font-size .4s}
.app.noticed #face{width:min(112px,16vh);height:min(112px,16vh)}
.app.noticed .word{font-size:22px;opacity:.95;margin-top:0}
.app.noticed .detail:empty{display:none}
.affirm{display:none}
.app.noticed .affirm{display:grid;justify-items:center;align-items:start;max-width:350px;padding:22px 30px 0}
.app.noticed .facewrap{right:0}
.app.noticed .vscale{opacity:0}
.app.noticed .word{margin-top:10px}
.app.noticed .detail{margin-top:4px}
.affirm > *{grid-area:1/1}
.wd{position:relative;margin:0;font-weight:500;font-size:30px;letter-spacing:.01em;line-height:1.2;pointer-events:none;animation:wdShow 1.75s ease both}
@keyframes wdShow{0%{opacity:0;transform:scale(.5) translateY(10px)}13%{opacity:1;transform:scale(1.1)}23%{transform:none}76%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
.wd i{position:absolute;left:50%;top:50%;font-style:normal;font-size:13px;line-height:1;pointer-events:none;opacity:0;animation:wdSp 1.1s ease-out .2s backwards}
@keyframes wdSp{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--s)) rotate(120deg)}}
.am{margin:0;text-align:center;font-weight:300;font-size:17px;line-height:1.62;opacity:.96;text-wrap:balance;animation:amIn .9s ease 1.6s backwards}
@keyframes amIn{from{opacity:0;transform:translateY(10px)}to{opacity:.94;transform:none}}

/* the ending */
.noted{position:absolute;inset:0;z-index:30;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 50% 36%,rgba(255,255,255,.34),rgba(255,255,255,0) 60%),linear-gradient(172deg,var(--g1),var(--g2))}
.noted.go{animation:ndIn .35s ease backwards}
@keyframes ndIn{from{opacity:0}}
.noted.bye{opacity:0;transition:opacity .3s ease .22s}
#ndFx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ndc{position:relative;display:grid;justify-items:center;gap:10px;padding:0 26px;max-width:400px;text-align:center;transform-origin:50% 0}
.noted.bye .ndc{transform:translateY(-36vh) scale(.1);opacity:0;transition:transform .5s cubic-bezier(.6,0,.85,.35),opacity .45s ease .05s}
.ndmk{position:relative;width:86px;height:86px;margin-bottom:6px}
.ndmk svg{display:block;width:100%;height:100%;overflow:visible}
.ndmk circle,.ndmk path{fill:none;stroke:rgb(var(--fg));stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}
.ndmk circle{stroke-width:3;transform:rotate(-90deg);transform-origin:40px 40px}
.ndmk path{stroke-width:5.5}
@keyframes ndDraw{from{stroke-dashoffset:1}}
.noted.go .ndmk circle{animation:ndDraw .75s cubic-bezier(.6,0,.2,1) .1s backwards}
.noted.go .ndmk path{animation:ndDraw .38s cubic-bezier(.3,.9,.3,1) .72s backwards}
.noted.go .ndmk svg{animation:ndBeat .55s ease 1.05s}
@keyframes ndBeat{35%{transform:scale(1.16)}}

.calmart .tout{opacity:0;animation:cOut 12s linear infinite}
@keyframes cStep{0%,100%{opacity:.18}40%,60%{opacity:1}}
.calmart .ft{animation:cStep 3s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes cSway{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
.calmart .wv{animation:cSway 3.2s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes cRip{0%{opacity:.1}45%{opacity:.95}100%{opacity:.1}}
.calmart .rp{animation:cRip 3s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes cBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.calmart .hb{animation:cBeat 2.4s ease-in-out infinite}
.calmhow{font-size:16px;line-height:1.5;text-wrap:balance;max-width:330px;margin:0 auto}
.calmwhy{margin:0 auto;max-width:320px;text-align:center;font-weight:300;font-size:13px;line-height:1.45;opacity:.85;text-wrap:balance}

.fly{position:fixed;z-index:50;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:rgb(var(--fg));box-shadow:0 0 18px 4px rgba(var(--fg),.6);pointer-events:none}

/* sheets: elaborate, comment, place, an earlier feeling, the places map */
.sheet{position:fixed;inset:0;z-index:40;display:grid;justify-items:center;background:var(--stage)}
.sh{--g1:#7A5E06;--g2:#C29A1E;position:relative;width:min(430px,100%);height:100%;overflow-y:auto;overscroll-behavior:contain;color:rgb(var(--fg));display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(120% 60% at 50% 22%,rgba(255,255,255,.2),transparent 62%),linear-gradient(172deg,var(--g1),var(--g2));
  padding:10px max(18px, env(safe-area-inset-right, 0px)) 112px max(18px, env(safe-area-inset-left, 0px));animation:shIn .3s cubic-bezier(.3,.7,.2,1)}
@keyframes shIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.sh.plain{background:var(--bg);color:var(--ink);font-family:var(--font-body)}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{width:38px;height:38px;border-radius:50%;border:0;background:rgba(var(--fg),.2);cursor:pointer;display:grid;place-items:center;flex:none}
.plain .x{background:var(--track)}
.when{display:inline-flex;align-items:center;gap:8px;font-weight:300;font-size:13.5px;letter-spacing:.06em}
.when input{border:0;background:rgba(0,0,0,.18);color:rgb(var(--fg));border-radius:999px;padding:4px 9px;color-scheme:dark;font-weight:400}
.sh h2{font-weight:300;font-size:clamp(26px,7.6vw,32px);letter-spacing:-.01em;line-height:1.12;margin:6px 0 0;text-align:center;text-wrap:balance}
.sh h2.big{font-family:var(--font-mood);font-weight:800;font-variation-settings:"SOFT" 100,"WONK" 0;font-size:clamp(36px,11vw,48px);letter-spacing:.015em;text-transform:uppercase}
.sub{margin:0;text-align:center;font-weight:300;font-size:14px;opacity:.9}
.sub b{font-weight:500}
.sec-h{margin:8px 0 0;font-weight:300;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.pick{min-height:36px;display:flex;justify-content:center;align-items:center;font-weight:300;font-size:14px}
.pick .pc{background:rgb(var(--fg));color:rgb(var(--inv));border-radius:999px;padding:6px 16px;font-weight:500;font-size:16px}
.pick span.h{opacity:.85}
.wheel svg{display:block;width:100%;height:auto;overflow:visible}
.wheel .sec{fill:rgba(var(--fg),.2);stroke:rgba(var(--fg),.6);stroke-width:1;cursor:pointer;transition:fill .15s}
.wheel .sec:hover{fill:rgba(var(--fg),.36)}
.wheel .sec.on{fill:rgb(var(--fg))}
.wheel .sec.dim{fill:rgba(var(--fg),.08)}
.wheel .ghostsec{fill:rgba(var(--fg),.06);stroke:rgba(var(--fg),.3);stroke-dasharray:3 4}
.wheel text{font-family:var(--font-display);fill:rgb(var(--fg));pointer-events:none;font-weight:400;font-size:11.5px}
.wheel text.ct{font-weight:500;font-size:12.5px}
.wheel svg.four text.ct{font-size:10.5px}
.wheel text.on{fill:#151924}
.wheel text.dim{opacity:.6}
.wheel text.hintt{font-weight:300;font-size:12.5px;opacity:.85}
.sh textarea{width:100%;border:0;border-radius:18px;padding:14px 16px;background:rgba(var(--fg),.2);color:rgb(var(--fg));resize:vertical;min-height:110px;font-size:16px;font-weight:300}
.sh textarea::placeholder{color:rgba(var(--fg),.75)}
.sh textarea:focus{outline:2px solid rgb(var(--fg))}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts button{border:1px solid rgba(var(--fg),.5);background:transparent;border-radius:999px;padding:7px 13px;font-weight:400;font-size:13.5px;cursor:pointer}
.opts button.sug{border-style:dashed;font-weight:300;opacity:.9}
.opts button[aria-pressed="true"]{background:rgb(var(--fg));color:rgb(var(--inv));border-color:rgb(var(--fg))}
.newplace{display:flex;gap:6px}
.newplace input{flex:1;min-width:0;border:0;border-radius:999px;padding:9px 14px;background:rgba(var(--fg),.2);color:rgb(var(--fg));font-weight:300}
.newplace input::placeholder{color:rgba(var(--fg),.75)}
.newplace button{border:0;border-radius:999px;padding:9px 16px;background:rgb(var(--fg));color:rgb(var(--inv));font-weight:500;cursor:pointer}
.sh-actions{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);display:flex;gap:10px;z-index:2;padding:16px max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));background:linear-gradient(to bottom,transparent,rgba(0,0,0,.14) 45%)}
.plain .sh-actions{background:linear-gradient(to bottom,transparent,var(--bg) 45%)}
.btn{flex:1;border:0;border-radius:999px;padding:16px;font-weight:500;font-size:17px;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.w{background:rgb(var(--fg));color:rgb(var(--inv));box-shadow:0 10px 28px rgba(0,0,0,.24)}
.btn.g{background:rgba(var(--fg),.22);color:rgb(var(--fg));flex:0 0 auto;padding-inline:22px}
.plain .btn.w{background:var(--ink);color:var(--bg)}

/* places map (plain sheet) */
.plain h2{font-family:var(--font-display);font-weight:400}
.seg{display:inline-flex;align-self:center;background:var(--track);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.mapcard{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:10px 6px}
.map svg{display:block;width:100%;height:auto;overflow:visible}
.map .link{stroke:var(--hatch);stroke-width:1.2}
.map .trail{fill:none;stroke:var(--hatch);stroke-width:1.5;stroke-dasharray:2 6;stroke-linecap:round}
.map .hub{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.map .pin{fill:var(--ink)}
.map .pn{font-family:var(--font-body);font-size:13px;font-weight:700;fill:var(--ink)}
.map .pc{font-family:var(--font-body);font-size:11px;font-weight:600;fill:var(--muted)}
.map .mdot{stroke:var(--surface);stroke-width:2;cursor:pointer}
.map svg.demo{opacity:.5;pointer-events:none}
.map-note{margin:4px 10px 0;font-size:12.5px;color:var(--muted);text-align:center}
.map-note b{color:var(--ink)}
.spots{display:grid;gap:8px}
.spot{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:11px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.spot b{font-weight:700;font-size:14.5px}
.spot b i{font-style:normal;font-weight:600;font-size:11px;color:var(--muted);margin-left:4px}
.spot .co{grid-column:1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.spot > a,.spot > button{grid-column:2;grid-row:1/3;font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:var(--track);border:0;border-radius:999px;padding:8px 13px;text-decoration:none;cursor:pointer;white-space:nowrap}
.spot > button.lnk{grid-column:1;grid-row:auto;justify-self:start;background:none;padding:2px 0;font-weight:600;font-size:12.5px;color:var(--muted);text-decoration:underline}
.spotform{grid-column:1/-1;display:flex;gap:6px;margin-top:8px}
.spotform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:var(--bg);color:var(--ink);font-size:16px}
.spotform button{border:0;border-radius:999px;padding:9px 16px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}

.infobox{position:fixed;z-index:60;max-width:min(270px,calc(100vw - 24px));background:#151924;color:#fff;border-radius:12px;padding:9px 12px;font-family:var(--font-body);font-size:13px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none;display:grid;gap:2px}
.infobox b{font-weight:700}
.infobox q{font-style:italic;overflow-wrap:anywhere}
.infobox small{opacity:.7}
.toast{position:fixed;left:50%;top:calc(46px + env(safe-area-inset-top, 0px));transform:translate(-50%,-10px);opacity:0;background:rgba(21,25,36,.86);color:#fff;padding:10px 18px;border-radius:999px;font-weight:300;font-size:13.5px;letter-spacing:.04em;transition:opacity .25s,transform .25s;pointer-events:none;z-index:70;max-width:calc(100% - 32px);text-align:center;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

  .am{font-size:15px;line-height:1.5}.app.noticed .affirm{padding:12px 20px 0}.app.noticed .word{margin-top:6px}.wd{font-size:26px}.app.noticed #face{width:74px;height:74px}.tb{padding-top:9px;padding-bottom:9px} .vscale span{display:none} .vscale{top:16%;bottom:16%} .chart{min-height:96px} .ib{width:48px;height:48px} .word{font-size:30px} .okb{width:50px;height:50px} }

  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url(fonts/outfit-latin-1.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

/* ---- the public web version ---- */
html,body{height:100%;background:#000;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
.app{padding-top:max(8px, env(safe-area-inset-top, 0px));padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
.sh{padding-top:calc(10px + env(safe-area-inset-top, 0px))}
.sh.wrapsh{padding-top:env(safe-area-inset-top, 0px)}
@media (min-width:600px){.app{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.6)}}
</style>

<div class="app" id="app">
  <header>
    <div class="dash" id="dash" inert><div class="dash-in" id="dashIn">
    <div class="top-row">
      <div class="daynav">
        <button type="button" class="chev" id="prev" aria-label="Previous day"><svg width="12" height="12" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="daylabel" id="dayLabel">today</button>
        <button type="button" class="chev" id="next" aria-label="Next day"><svg width="12" height="12" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="tools">
        <div class="tg" id="scopeTg" role="group" aria-label="Range"><button type="button" data-scope="day" aria-pressed="true">day</button><button type="button" data-scope="week" aria-pressed="false">week</button></div>
        <button type="button" class="pinbtn" id="pinBtn" aria-label="Places: where you felt what"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.5a4.6 4.6 0 0 0-4.6 4.6C3.4 9.6 8 14.5 8 14.5s4.6-4.9 4.6-8.4A4.6 4.6 0 0 0 8 1.5zm0 6.3a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6z"/></svg></button>
      </div>
    </div>
    <div class="chart" id="chart"></div>
    <button type="button" class="exnote" id="exNote" hidden>example feelings · tap to clear</button>
    <div class="under"><div class="checks" id="checks" role="img"></div><div class="wkwraps" id="wkWraps" hidden></div><button type="button" class="wrapbtn" id="wrapBtn" hidden></button></div>
    </div></div>
    <div class="pull" id="pull">
      <button type="button" class="tab" id="dashTab" aria-expanded="false" aria-controls="dash" aria-label="Show your curve"><svg viewBox="0 0 54 16" aria-hidden="true"><path d="M5 4 27 12 49 4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </header>

  <main class="temp" id="temp" role="slider" tabindex="0" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="6" aria-label="How you feel right now, from awful up to wonderful">
    <button type="button" class="mkb r" id="crownBtn" aria-pressed="false" aria-label="Mark this as the highlight of the day"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M2.6 8.2 7.2 11.8 12 4.6l4.8 7.2 4.6-3.6-1.7 9.3H4.3zM4.6 19h14.8v2H4.6z"/></svg><span>highlight</span></button>

        <circle id="fCL" class="bl" cx="-45" cy="14" r="11"/><circle id="fCR" class="bl" cx="45" cy="14" r="11"/>
        <g class="ft">
        <g fill="currentColor"><ellipse id="fEL" rx="9"/><ellipse id="fER" rx="9"/></g>
        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path id="fAL" stroke-width="5.5"/><path id="fAR" stroke-width="5.5"/><path id="fBL" stroke-width="3.6"/><path id="fBR" stroke-width="3.6"/>
          <path id="fNose" stroke-width="3.2" opacity=".7"/><path id="fDim" stroke-width="3"/>
          <path id="fMouth" stroke-width="5.5" fill="currentColor"/>
          <circle id="fSigh" r="3" stroke-width="2.2"/><circle id="fSigh2" r="3" stroke-width="2.2"/></g>
        <g id="fLids" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"><path id="fLL"/><path id="fLR"/></g>
        <path id="fMouthW" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="fTeeth" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="-14" y="-6" width="28" height="12" rx="4.5" stroke-width="4.5"/><path d="M-5 -6v12M5 -6v12" stroke-width="2.6"/></g>
        <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"><path id="fSt1" d="M-62 -50q-7 -7 0 -14t0 -14"/><path id="fSt2" d="M62 -50q7 -7 0 -14t0 -14"/></g>
        <g fill="currentColor" font-family="Outfit,sans-serif"><text id="fZ1" font-size="24" font-weight="700">z</text><text id="fZ2" font-size="16" font-weight="700">z</text><text id="fQ" font-size="36" font-weight="600" text-anchor="middle">?</text>
          <circle id="fD1" cx="46" cy="-60" r="4"/><circle id="fD2" cx="59" cy="-63" r="4"/><circle id="fD3" cx="72" cy="-60" r="4"/><path id="fBolt" d="M4 -24l-13 19h9l-6 17 17 -23h-9z"/></g>
        <g id="fCloud"><path d="M-22 4a11 11 0 0 1 3 -21.5a15 15 0 0 1 28 -3a12 12 0 0 1 9 24.5z" fill="currentColor" fill-opacity=".9"/><path id="fRain" d="M-12 10v7M0 10v7M12 10v7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></g>
        <g id="fNote"><ellipse rx="4.6" ry="3.4" transform="rotate(-18)" fill="currentColor"/><path d="M4.2 -1.2V-17l9 3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g fill="currentColor">

          <path id="fSweat" d="M0 0c2.8 4.2 3.8 5.6 3.8 7.6a3.8 3.8 0 0 1-7.6 0c0-2 1-3.4 3.8-7.6z"/>
          <path id="fS1" d="M0 -9Q0 0 9 0Q0 0 0 9Q0 0 -9 0Q0 0 0 -9Z"/><path id="fS2" d="M0 -9Q0 0 9 0Q0 0 0 9Q0 0 -9 0Q0 0 0 -9Z"/><path id="fS3" d="M0 -9Q0 0 9 0Q0 0 0 9Q0 0 -9 0Q0 0 0 -9Z"/>
          <path id="fH1" d="M0 6.7C-10.5 -1 -4.2 -8.8 0 -2.1C4.2 -8.8 10.5 -1 0 6.7Z"/><path id="fH2" d="M0 6.7C-10.5 -1 -4.2 -8.8 0 -2.1C4.2 -8.8 10.5 -1 0 6.7Z"/></g>
        </g>
      </svg>
      <p class="word" id="word"></p>
      <p class="detail" id="detail"></p>
      <div class="affirm" id="affirm" aria-live="polite">
        <p class="wd">Noticed!<i style="--dx:-74px;--dy:-26px;--s:1.3">✦</i><i style="--dx:78px;--dy:-22px;--s:1.1">✦</i><i style="--dx:-52px;--dy:24px;--s:.8">✦</i><i style="--dx:58px;--dy:26px;--s:.9">✦</i><i style="--dx:-12px;--dy:-38px;--s:.7">✦</i><i style="--dx:20px;--dy:36px;--s:.6">✦</i></p>
        <p class="am" id="amText"></p>
      </div>
    </div>
    <div class="vscale" aria-hidden="true"><div class="vs-line"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b id="mark"></b></div></div>
    <button type="button" class="backb" id="backBtn">‹ change mood</button>
    <div class="wscale" id="wscale" aria-hidden="true"><div class="vs-line"><i></i><i></i><i class="mid"></i><i></i><i></i><b id="wMark"></b></div></div>
    <span class="wlab" id="wU" aria-hidden="true"></span><span class="wlab" id="wD" aria-hidden="true"></span>
    <div class="hscale" id="hscale" aria-hidden="true"><span id="hL"></span><div class="hs-line" id="hsLine"></div><span id="hR"></span></div>
    <p class="hint" id="hint">swipe up or down, then let go</p>
  </main>

  <footer class="actions" id="actions">
    <div class="slot">
      <div class="tune" id="tune">
        <button type="button" class="tb helpt" id="helpBtn" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path class="f" d="M6 1.5h4V6h4.5v4H10v4.5H6V10H1.5V6H6z"/></svg><span>Help me get back to center</span></button>
        <button type="button" class="tb" id="palBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/><path d="M14.8 10.4l5-2.9M14.8 13.6l5 2.9M12 15.2V21M9.2 13.6l-5 2.9M9.2 10.4l-5-2.9"/><path class="f" d="M12 8.8V3a9 9 0 0 1 7.8 4.5l-5 2.9A3.2 3.2 0 0 0 12 8.8z"/></svg><span>Tap on the exact feeling?</span></button>
        <button type="button" class="tb" id="noteBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20l1.2-4.2A8.5 8.5 0 1 1 20.5 11.5z"/></svg><span>Add what caused this feeling?</span></button>
        <button type="button" class="okb" id="okBtn" aria-label="Done. Finish this check-in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.6 4.6L19 7.5"/></svg></button>
      </div>
    </div>
  </footer>
  <button type="button" class="notif" id="notif" aria-live="polite"></button>
  <div class="splash" id="splash"><p>Howdy Dani?</p></div>
  <div class="noted" id="noted" hidden aria-live="assertive"><canvas id="ndFx" aria-hidden="true"></canvas><div class="ndc"><div class="ndmk" id="ndMark"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" pathLength="1"/><path d="M25.5 41.5 36 52l19-22" pathLength="1"/></svg></div><p class="nt" id="ndWord" aria-label="Noted!"></p><svg class="ndline" viewBox="0 0 230 14" aria-hidden="true"><path d="M4 9C46 2 92 13 138 6s64 3 88-2" pathLength="1"/></svg><p class="nm">Great, You just became aware. That’s the practice itself! See you at the next emotion.</p><div class="ndchecks" id="ndChecks"></div></div></div>

<div class="infobox" id="infobox" hidden></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
/* the heat scale: deep rose-red at the bottom, through orange and gold, up to emerald; deep enough that white reads on all of it */
const LV = [
  {name:'Awful', color:'#E0245E', c:['#7A0F3A','#DE2A5C']},
  {name:'Bad', color:'#F0522D', c:['#A3220F','#EE5630']},
  {name:'Low', color:'#F58A1F', c:['#AE4C06','#EE8A24']},
  {name:'Okay', color:'#E9BD12', c:['#876800','#D2A412']},
  {name:'Good', color:'#9CC42A', c:['#507A0A','#8DB826']},
  {name:'Great', color:'#42B955', c:['#1F7A2E','#42B655']},
  {name:'Wonderful', color:'#13B87A', c:['#087048','#14B67A']},
];
/* the slice of the emotion wheel that belongs to each mood level: core feelings, each with four more exact words */
const WHEEL = [
  [['Furious',['Enraged','Hostile','Betrayed','Hateful']],['Terrified',['Panicked','Helpless','Trapped','Dread']],['Despair',['Hopeless','Heartbroken','Worthless','Grieving']],['Ashamed',['Humiliated','Disgusted','Exposed','Small']]],
  [['Angry',['Frustrated','Annoyed','Resentful','Bitter']],['Anxious',['Worried','Overwhelmed','Stressed','Insecure']],['Sad',['Hurt','Rejected','Guilty','Empty']]],
  [['Tired',['Sluggish','Weary','Sleepy','Drained']],['Uneasy',['Tense','Impatient','Irritable','Nervous']],['Down',['Disappointed','Lonely','Gloomy','Discouraged']]],
  [['Numb',['Flat','Detached','Apathetic','Blank']],['Bored',['Restless','Unmotivated','Distracted','Idle']],['Unsure',['Confused','Hesitant','Mixed','Torn']]],
  [['Peaceful',['Calm','Content','Relaxed','Relieved']],['Curious',['Intrigued','Focused','Engaged','Open']],['Steady',['Comfortable','Safe','Rested','Okay']]],
  [['Happy',['Cheerful','Playful','Delighted','Amused']],['Proud',['Confident','Capable','Respected','Accomplished']],['Loved',['Grateful','Appreciated','Included','Cared for']],['Excited',['Eager','Inspired','Energized','Hopeful']]],
  [['Joyful',['Ecstatic','Elated','Euphoric','Blissful']],['Adored',['Cherished','In love','Moved','Seen']],['Powerful',['Triumphant','Unstoppable','Fearless','Free']]],
];
/* an expression for every feeling on the wheel: "eyes brows mouth extras" */
const FACE = {
  Furious:'line angry teeth steam', Enraged:'x angry wail steam', Hostile:'side angry frown -', Betrayed:'big worried frown tear', Hateful:'line angry frown bolt',
  Terrified:'big worried O sweat', Panicked:'ring worried wail sweat', Helpless:'low worried smallfrown tears', Trapped:'side worried teeth sweat', Dread:'big worried wavy cloud',
  Despair:'low worried frown tears', Hopeless:'line worried frown cloud', Heartbroken:'low worried wail tears', Worthless:'half - smallfrown tear', Grieving:'low worried wavy tears',
  Ashamed:'side worried wavy blush', Humiliated:'low worried wavy blush+sweat', Disgusted:'line angry wavy -', Exposed:'big worried o blush', Small:'dot worried smallfrown -',
  Angry:'dot angry frown steam', Frustrated:'line angry teeth -', Annoyed:'half flat flat -', Resentful:'side angry frown -', Bitter:'line angry wavy -',
  Anxious:'big worried wavy sweat', Worried:'dot worried smallfrown -', Overwhelmed:'ring worried O sweat', Stressed:'line worried teeth sweat', Insecure:'side worried small -',
  Sad:'dot worried frown tear', Hurt:'low worried frown tear', Rejected:'side worried frown -', Guilty:'low worried wavy sweat', Empty:'ring - flat -',
  Tired:'half - flat zzz', Sluggish:'half - wavy -', Weary:'low worried flat -', Sleepy:'low - o zzz', Drained:'line worried smallfrown sweat',
  Uneasy:'side worried wavy -', Tense:'dot flat teeth -', Impatient:'side angry flat dots', Irritable:'line angry smallfrown -', Nervous:'big worried wavy sweat',
  Down:'dot worried smallfrown cloud', Disappointed:'low worried frown -', Lonely:'side worried smallfrown -', Gloomy:'half - frown cloud', Discouraged:'low worried flat -',
  Numb:'ring - flat -', Flat:'line - flat -', Detached:'side - flat -', Apathetic:'half - flat -', Blank:'dot - flat dots',
  Bored:'half flat flat dots', Restless:'side raised wavy -', Unmotivated:'half - smallfrown -', Distracted:'side - o -', Idle:'low - flat zzz',
  Unsure:'dot one wavy q', Confused:'ring one o q', Hesitant:'side worried flat dots', Mixed:'dot one smirk -', Torn:'side worried wavy q',
  Peaceful:'low - small -', Calm:'low - smile -', Content:'arc - small blush', Relaxed:'low - bigsmile -', Relieved:'arc raised o sweat',
  Curious:'big one small q', Intrigued:'side raised smirk q', Focused:'line flat flat -', Engaged:'big raised smile spark', Open:'dot raised smile -',
  Steady:'dot - small -', Comfortable:'arc - small -', Safe:'low - smile heart', Rested:'arc - smile spark', Okay:'dot - smile -',
  Happy:'arc - bigsmile blush', Cheerful:'arc raised grin -', Playful:'wink one smirk spark', Delighted:'star raised grin -', Amused:'arc - smirk -',
  Proud:'arc raised smirk spark', Confident:'dot raised smirk -', Capable:'dot flat smile spark', Respected:'low - smile -', Accomplished:'arc raised grin spark',
  Loved:'heart - smile blush', Grateful:'low - smile heart', Appreciated:'arc - smile heart', Included:'dot raised bigsmile blush', 'Cared for':'low - small heart+blush',
  Excited:'star raised grin spark', Eager:'big raised bigsmile -', Inspired:'big raised o spark', Energized:'dot raised grin bolt', Hopeful:'big raised smile spark',
  Joyful:'arc raised grin spark', Ecstatic:'star raised grin spark', Elated:'arc raised grin blush', Euphoric:'star - grin heart', Blissful:'low - bigsmile blush',
  Adored:'heart raised bigsmile blush', Cherished:'low - smile heart+blush', 'In love':'heart - grin heart', Moved:'big worried smile tear', Seen:'big raised smile spark',
  Powerful:'dot angry smirk bolt', Triumphant:'arc raised grin spark', Unstoppable:'line angry grin bolt', Fearless:'dot flat smirk -', Free:'arc raised bigsmile spark',
};
const LVFACE = ['low worried wail tears','dot worried frown -','dot worried smallfrown -','dot - small -','dot - smile -','arc - smile blush','arc raised grin spark'];
/* draws one small blob face, in the same style as the big one: a soft translucent body with white features */
function miniFace(name, lv, seed){
  const [eyes, brows, mouth, extra] = (FACE[name] || LVFACE[lv]).split(' ');
  const t = (lv-3)/3, neg = Math.max(0,-t), posi = Math.max(0,t), ey = -6 + 2*neg, by = ey - 11, my = 13 + 2*neg;
  const S = (d, w) => `<path d="${d}" fill="none" stroke="currentColor" stroke-width="${w || 3}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const body = (R, off) => { let d = ''; const N = 48, sx = 1 + 0.06*neg;
    for(let i=0;i<=N;i++){ const th = i/N*2*Math.PI, sn = Math.sin(th), r = R*(1 + 0.05*Math.sin(3*th + seed*1.9 + off) + 0.035*Math.sin(5*th + seed*0.7 + off));
      d += (i ? 'L' : 'M') + (r*Math.cos(th)*sx).toFixed(1) + ' ' + (r*sn*(sn < 0 ? 1 - 0.12*neg + 0.04*posi : 1) + 2*neg).toFixed(1); }
    return d + 'Z'; };
  const star = (cx, cy, r) => `<path d="M${cx} ${cy-r}Q${cx} ${cy} ${cx+r} ${cy}Q${cx} ${cy} ${cx} ${cy+r}Q${cx} ${cy} ${cx-r} ${cy}Q${cx} ${cy} ${cx} ${cy-r}Z" fill="currentColor"/>`;
  const heart = (cx, cy, s) => `<path d="M${cx} ${cy+s*0.95}C${cx-s*1.5} ${cy-s*0.15} ${cx-s*0.6} ${cy-s*1.25} ${cx} ${cy-s*0.3}C${cx+s*0.6} ${cy-s*1.25} ${cx+s*1.5} ${cy-s*0.15} ${cx} ${cy+s*0.95}Z" fill="currentColor"/>`;
  const drop = (cx, cy) => `<path d="M${cx} ${cy}c3 4.5 4 6 4 8a4 4 0 0 1-8 0c0-2 1-3.5 4-8z" fill="currentColor" fill-opacity=".85"/>`;
  const eye = s => { const ex = s*14;
    switch(eyes === 'wink' ? (s < 0 ? 'arc' : 'dot') : eyes){
      case 'big': return `<circle cx="${ex}" cy="${ey}" r="6" fill="currentColor"/>`;
      case 'arc': return S(`M${ex-6} ${ey+2.5}Q${ex} ${ey-5.5} ${ex+6} ${ey+2.5}`, 3.2);
      case 'low': return S(`M${ex-6} ${ey-1}Q${ex} ${ey+5.5} ${ex+6} ${ey-1}`, 3);
      case 'line': return S(`M${ex-5.5} ${ey}h11`, 3);
      case 'x': return S(`M${ex-4} ${ey-4}l8 8M${ex+4} ${ey-4}l-8 8`, 2.8);
      case 'heart': return heart(ex, ey, 5.4);
      case 'star': return star(ex, ey, 6.6);
      case 'half': return `<path d="M${ex-5.5} ${ey-0.5}h11a5.5 5.5 0 0 1-11 0z" fill="currentColor"/>` + S(`M${ex-6.5} ${ey-1.2}h13`, 2.4);
      case 'side': return `<circle cx="${ex+2.6}" cy="${ey}" r="4.4" fill="currentColor"/>`;
      case 'ring': return `<circle cx="${ex}" cy="${ey}" r="5.2" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="${ex}" cy="${ey}" r="1.4" fill="currentColor"/>`;
      default: return `<circle cx="${ex}" cy="${ey}" r="4.6" fill="currentColor"/>`;
    } };
  const brow = s => { const xi = s*7, xo = s*21;
    switch(brows === 'one' ? (s < 0 ? 'flat' : 'raised') : brows){
      case 'angry': return S(`M${xo} ${by-3}L${xi} ${by+2.5}`, 2.6);
      case 'worried': return S(`M${xo} ${by+2.5}L${xi} ${by-3}`, 2.6);
      case 'raised': return S(`M${xo} ${by-2}Q${s*14} ${by-7} ${xi} ${by-2}`, 2.6);
      case 'flat': return S(`M${xo} ${by}L${xi} ${by}`, 2.6);
      default: return '';
    } };
  const M = {
    smile: () => S(`M-9 ${my}Q0 ${my+8} 9 ${my}`), bigsmile: () => S(`M-12 ${my-1}Q0 ${my+12} 12 ${my-1}`),

  cards.push({id:'carry', lv:aR, html:`<p class="wr-k">one thing to carry</p><div class="wr-note"><h3 class="wr-h">${q}</h3></div><p class="wr-p">Noticing is the practice. See you at the next emotion.</p>${isT ? `<label class="wr-greet"><input type="checkbox" id="wrGreet"${store.carryOff ? '' : ' checked'}><span>greet me with this tomorrow</span></label>` : ''}<button type="button" class="wr-done" data-a="close">Done</button>`});
  return {k, i:Math.min(keepI || 0, cards.length - 1), cards, q, isT, step};
}
function drawWrap(){
  const c = WR.cards[WR.i], g = c.g || LV[c.lv].c, box = $('shBox');
  box.style.setProperty('--g1', g[0]); box.style.setProperty('--g2', g[1]);
  $('wr').innerHTML = `<div class="wr-top"><div class="wr-seg" role="img" aria-label="Card ${WR.i + 1} of ${WR.cards.length}">${WR.cards.map((_,i) => `<i class="${i <= WR.i ? 'on' : ''}"></i>`).join('')}</div><button type="button" class="x" data-a="close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div><div class="wr-card${WR.flip ? ' flip' : ''}" data-id="${c.id}">${c.html}</div><p class="wr-tap">${c.guess || c.id === 'carry' ? '' : 'tap to continue'}</p>`;
  WR.flip = false;
}
function wrapGo(d){ if(!WR) return; const n = WR.i + d; if(n < 0 || n >= WR.cards.length || (d > 0 && WR.cards[WR.i].guess)) return; WR.i = n;
  if(WR.cards[n].id === 'carry'){ store.seen = store.seen || {}; store.seen[WR.k] = 1; if(WR.isT && !store.carryOff) store.carry = {from:WR.k, text:WR.q}; save(); } drawWrap(); }
function openWrap(k){ const w = buildWrap(k); if(!w){ toast('nothing logged that day yet'); return; } WR = w; openSheet('wrap', null); drawWrap(); }
function drawPlaces(){
  const T = SH.T;
  const g = geoOf(T);
  $('shPlaces').innerHTML = `<p class="geoline"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="${PIN}"/></svg>${g ? `<span>${fmtGeo(g)}</span><a href="${osmLink(g)}" target="_blank" rel="noopener">open map ↗</a>` : '<span>no exact spot yet</span>'}</p><div class="opts">${store.places.map(p => `<button type="button" data-place="${p.id}" aria-pressed="${p.id === T.place}">${esc(p.name)}</button>`).join('')}${SUGGEST.filter(n => !store.places.some(p => p.name.toLowerCase() === n.toLowerCase())).slice(0, 6).map(n => `<button type="button" class="sug" data-suggest="${esc(n)}">+ ${esc(n)}</button>`).join('')}${T.place ? '<button type="button" data-place="">No place</button>' : ''}</div>
    <form class="newplace" id="shNewPlace" style="margin-top:12px"><input id="shPlaceName" maxlength="24" placeholder="Or name your own, e.g. Mum’s kitchen" aria-label="New place name"><button type="submit">Add</button></form>
    <form class="newplace" id="shGeo" style="margin-top:8px"><input id="shGeoIn" maxlength="300" placeholder="Exact spot: 47.4979, 19.0402 or a maps link" aria-label="Coordinates of this spot"><button type="submit">Set</button></form>`;
}
function drawSpots(demo){
  const el = $('shSpots'); if(!el) return;
  const list = demo ? DEMO_PLACES : store.places;
  el.innerHTML = list.map(p => { const g = p.lat != null ? {lat:p.lat, lng:p.lng} : null, edit = !demo && ui.spotEdit === p.id;
    return `<div class="spot"><b>${esc(p.name)}${demo || p.ex ? ' <i>example</i>' : ''}</b><span class="co">${g ? fmtGeo(g) : 'no exact spot yet'}</span>${g ? `<a href="${osmLink(g)}" target="_blank" rel="noopener">open map ↗</a>` : demo ? '' : `<button type="button" data-spot="${p.id}">set spot</button>`}${g && !demo && !edit ? `<button type="button" class="lnk" data-spot="${p.id}">change</button>` : ''}${edit ? `<form class="spotform" id="spotForm" data-pid="${p.id}"><input maxlength="300" placeholder="47.4979, 19.0402 or a maps link" aria-label="Coordinates for ${esc(p.name)}"><button type="submit">Save</button></form>` : ''}</div>`; }).join('') || '<p class="map-note">No places yet.</p>';
  const inp = el.querySelector('.spotform input'); if(inp) inp.focus();
}
function setPlace(id){ mine(); SH.T.place = id; const pp = realPlace(id); if(pp && SH.T.geo && pp.lat == null){ pp.lat = SH.T.geo.lat; pp.lng = SH.T.geo.lng; save(); } if(SH.kind === 'place'){ closeSheet(); } else drawPlaces(); }
/* places: each place is a pin with its feelings around it, coloured by mood */
function drawMap(){
  const el = $('shMap'), W = el.clientWidth || 346, H = 336;
  document.querySelectorAll('#mapSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.ms === ui.mapScope));
  let logs = ui.mapScope === 'day' ? logsFor(ui.day) : store.logs.slice().sort((a,b) => a.t - b.t);
  const demo = !logs.some(l => realPlace(l.place)); if(demo) logs = DEMO_LOGS;
  const groups = new Map();
  logs.forEach(l => { const k = placeOf(l.place) ? l.place : ''; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(l); });
  const ids = [...groups.keys()], n = ids.length;
  const withG = ids.filter(id => { const p = placeOf(id); return p && p.lat != null; }), noG = ids.filter(id => !withG.includes(id)), geo = withG.length > 1, Hg = noG.length ? H - 92 : H;
  const P = {};
  if(geo){ const ps = withG.map(placeOf), la = ps.map(p => p.lat), lo = ps.map(p => p.lng), k = Math.cos(la[0]*Math.PI/180);
    const minX = Math.min(...lo)*k, maxX = Math.max(...lo)*k, minY = Math.min(...la), maxY = Math.max(...la), sp = Math.max(maxX-minX, maxY-minY, 1e-6);
    ps.forEach(p => { P[p.id] = [70 + (p.lng*k-minX)/sp*(W-140) + (sp - (maxX-minX))/sp*(W-140)/2, Hg-78 - (p.lat-minY)/sp*(Hg-150) - (sp - (maxY-minY))/sp*(Hg-150)/2]; });
    /* pins that would sit on top of each other are eased apart, keeping their directions */
    for(let it = 0; it < 80; it++){ for(let a = 0; a < withG.length; a++) for(let b = a + 1; b < withG.length; b++){ const A = P[withG[a]], B = P[withG[b]]; let dx = B[0]-A[0], dy = B[1]-A[1], d = Math.hypot(dx, dy) || .01;
        if(d < 96){ const m = (96 - d)/2/d; A[0] -= dx*m; A[1] -= dy*m; B[0] += dx*m; B[1] += dy*m; } }
      withG.forEach(id => { const q = P[id]; q[0] = Math.max(52, Math.min(W-52, q[0])); q[1] = Math.max(52, Math.min(Hg-92, q[1])); }); }
    noG.forEach((id,i) => { P[id] = [W*(i+1)/(noG.length+1), H-74]; });
  } else ids.forEach((id,i) => { if(n === 1) P[id] = [W/2, H/2-8]; else if(n === 2) P[id] = [W*(i ? .72 : .28), H/2-8];
      else { const a = -Math.PI/2 + i/n*2*Math.PI; P[id] = [W/2 + Math.cos(a)*(W/2-78), H/2-10 + Math.sin(a)*(H/2-74)]; } });
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${demo ? 'Example of the places map' : 'Places where feelings were captured'}" ${demo ? 'class="demo"' : ''}>`;
  if((ui.mapScope === 'day' || demo) && n > 1){ let d = '', last = null; logs.forEach(l => { const k = placeOf(l.place) ? l.place : ''; if(k !== last){ d += (d ? 'L' : 'M') + P[k][0].toFixed(1) + ' ' + P[k][1].toFixed(1); last = k; } }); s += `<path class="trail" d="${d}"/>`; }
  let dots = '';
  ids.forEach(id => { const [x,y] = P[id], ls = groups.get(id), p = placeOf(id);
    ls.forEach((l,i) => { let ring = 0, idx = i, cap = 8; while(idx >= cap){ idx -= cap; ring++; cap = 8 + ring*6; }
      const r = 30 + ring*17, a = -Math.PI/2 + (idx + (ring%2)*.5)/cap*2*Math.PI, dx = x + r*Math.cos(a), dy = y + r*Math.sin(a);
      s += `<line class="link" x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${dx.toFixed(1)}" y2="${dy.toFixed(1)}"/>`;
      dots += `<g class="pt" data-id="${l.id}" tabindex="0" role="button" aria-label="${esc(labelOf(l))} at ${hhmm(minsOf(l.t))}"><circle class="dot mdot" cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="${l.mark ? 11 : 8}" fill="${LV[l.v].color}"/>${l.mark ? `<path class="mki" fill-rule="evenodd" transform="translate(${(dx - 6.6).toFixed(1)} ${(dy - 6.8).toFixed(1)}) scale(.55)" d="${MK[l.mark]}"/>` : ''}</g>`; });
    const rings = ls.length > 8 ? (ls.length > 22 ? 3 : 2) : 1, avg = ls.reduce((a,l) => a+l.v, 0)/ls.length;
    dots += `<circle class="hub" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="15"/><path class="pin" transform="translate(${(x-8).toFixed(1)} ${(y-8).toFixed(1)})" d="${PIN}"/>
      <text class="pn" x="${x.toFixed(1)}" y="${(y + 30 + rings*17 + 6).toFixed(1)}" text-anchor="middle">${esc(p ? p.name : 'No place')}</text>
      <text class="pc" x="${x.toFixed(1)}" y="${(y + 30 + rings*17 + 21).toFixed(1)}" text-anchor="middle">${ls.length} · mostly ${esc(LV[Math.round(avg)].name.toLowerCase())}</text>`; });
  el.innerHTML = s + dots + '</svg>' + `<p class="map-note">${demo ? '<b>Example.</b> Add a place when you capture a feeling and your own map appears here.' : (geo ? 'Pins are arranged by their coordinates, eased apart where they are close.' + (noG.length ? ' Anything without coordinates is along the bottom.' : '') : 'A sketch, not to scale: add coordinates below to place the pins.') + ' Each dot is a feeling, coloured by mood.'}${logs.some(l => l.mark) ? ' A crown is a day’s highlight, a skull its low point.' : ''}</p>`;
  drawSpots(demo);
}

const sheet = $('sheet');
sheet.addEventListener('click', e => {
  if(!SH) return;
  if(SH.kind === 'wrap' && WR){
    const mp = e.target.closest('[data-markpick]'); if(mp && !mp.disabled){ const l = logById(mp.dataset.markpick); if(l && WR.step) setMark(l, WR.step); WR = buildWrap(WR.k, WR.i); drawWrap(); renderChart(); return; }
    const ms = e.target.closest('[data-markskip]'); if(ms){ wrSkip[WR.k + ms.dataset.markskip] = 1; WR = buildWrap(WR.k, WR.i); drawWrap(); return; }
    const gb = e.target.closest('[data-guess]'); if(gb){ store.guess = store.guess || {}; store.guess[WR.k] = +gb.dataset.guess; save(); WR = buildWrap(WR.k, WR.i); WR.flip = true; drawWrap(); return; }
    if(!e.target.closest('button, a, label, input')){ const r = $('shBox').getBoundingClientRect(); wrapGo(e.clientX < r.left + r.width*.28 ? -1 : 1); return; } }
  const fc = e.target.closest('.fc'); if(fc){ pickFace(fc); return; }
  const me = e.target.closest('.msg.me'); if(me){ const n = chatNotes(SH.T); mine(); if(me.dataset.i === 'when') SH.T.when = ''; else { n.splice(+me.dataset.i, 1); SH.T.note = n.join('\n'); if(!n.length) SH.T.when = ''; } if(SH.isLog) save(); clearTimeout(chatTimer); drawChat(true); return; }
  const q = e.target.closest('[data-q]'); if(q){ userSay(q.dataset.q); return; }
  const wn = e.target.closest('[data-when]'); if(wn){ sayWhen(wn.dataset.when); return; }
  const sg = e.target.closest('[data-suggest]'); if(sg){ const p = {id:'p' + Date.now().toString(36), name:sg.dataset.suggest}; store.places.push(p); save(); setPlace(p.id); return; }
  const pb = e.target.closest('[data-place]'); if(pb){ setPlace(pb.dataset.place); return; }
  const spb = e.target.closest('[data-spot]'); if(spb){ ui.spotEdit = ui.spotEdit === spb.dataset.spot ? null : spb.dataset.spot; drawSpots(false); return; }
  const ms = e.target.closest('[data-ms]'); if(ms){ ui.mapScope = ms.dataset.ms; drawMap(); return; }
  const pt = e.target.closest('.pt'); if(pt){ const l = logById(pt.dataset.id); if(l) openSheet('entry', l); return; }
  const b = e.target.closest('[data-a]'); if(!b) return; const a = b.dataset.a;
  if(a === 'close') closeSheet();
  else if(a === 'accept') accept(200);
  else if(a === 'mark'){ mine(); setMark(SH.T, b.dataset.m); openSheet('entry', SH.T); }
  else if(a === 'towheel') openSheet('wheel', SH.T, 'entry');
  else if(a === 'tochat') openSheet('chat', SH.T, 'entry');
  else if(a === 'clearword'){ mine(); SH.T.core = ''; SH.T.word = ''; drawWheel(); }
  else if(a === 'del'){
    if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Tap again'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'Delete'; } }, 3000); return; }
    store.logs = store.logs.filter(l => l.id !== SH.T.id); save(); SH = null; sheet.hidden = true; sheet.innerHTML = ''; paintDraft(); renderChart(); toast('deleted');
  }
});
sheet.addEventListener('change', e => { if(e.target.id === 'wrGreet' && WR){ store.carryOff = !e.target.checked; if(e.target.checked) store.carry = {from:WR.k, text:WR.q}; else delete store.carry; save(); } });
sheet.addEventListener('input', e => {
  if(!SH) return;
  if(e.target.id === 'shTime' && e.target.value){ const [h,m] = e.target.value.split(':').map(Number), cm = h*60+m, t = at(dk(SH.T.t), cm < DS ? cm + 1440 : cm); if(t <= Date.now() + 60000){ mine(); SH.T.t = t; } else toast('that time is still in the future'); }
});
sheet.addEventListener('submit', e => {
  e.preventDefault();
  if(e.target.id === 'shChat'){ userSay($('shSay').value); return; }
  if(e.target.id === 'shGeo' || e.target.id === 'spotForm'){
    const inp = e.target.querySelector('input'), g = parseGeo(inp.value);
    if(!g){ toast('could not read that · try 47.4979, 19.0402'); return; }
    if(e.target.id === 'spotForm'){ const pp = realPlace(e.target.dataset.pid); if(pp){ pp.lat = g.lat; pp.lng = g.lng; delete pp.ex; } ui.spotEdit = null; save(); drawMap(); }
    else { mine(); SH.T.geo = g; const pp = realPlace(SH.T.place); if(pp && pp.lat == null){ pp.lat = g.lat; pp.lng = g.lng; } save(); drawPlaces(); }

let rs; window.addEventListener('resize', () => { clearTimeout(rs); rs = setTimeout(renderChart, 120); });

paintDraft(); renderChart(); drawFace(0);
{ const sp = $('splash'), bye = () => { sp.classList.add('bye'); setTimeout(() => sp.remove(), 540); }, cy = store.carry && store.carry.from === addDays(TODAY(), -1) ? store.carry.text.replace(/^Tomorrow, /, 'Today, ') : '';
  if(cy){ const n = document.createElement('small'); n.textContent = cy; sp.querySelector('p').appendChild(n); }
